name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew android:mergeReleaseJavaResource
        env:
          CI: "false"
      - if: always()
        run: find android/build -name "base.jar" ; ls -la android/build/intermediates/merged_java_res/release/
