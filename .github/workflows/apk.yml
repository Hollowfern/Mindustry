name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Make init script
        run: |
          cat > init.gradle <<'EOF'
          gradle.ext.seen = false
          gradle.ext.gone = false
          allprojects {
            tasks.configureEach { t ->
              t.doLast {
                def f = t.project.rootProject.file("android/build/intermediates/merged_java_res/release/base.jar")
                if (t.name == "mergeReleaseJavaResource") {
                  gradle.seen = f.exists()
                  println "CHK merge done, exists=" + f.exists()
                } else if (gradle.seen && !gradle.gone && !f.exists()) {
                  gradle.gone = true
                  println "CHK MISSING after " + t.path
                }
              }
            }
          }
          EOF
      - name: Build
        shell: bash
        run: ./gradlew -I init.gradle android:assembleRelease 2>&1 | tee build.log
        env:
          CI: "false"
      - if: always()
        run: grep CHK build.log || true 
