name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew android:assembleRelease --stacktrace
        env:
          CI: "false"
      - name: Sign
        run: |
          keytool -genkeypair -keystore my.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=test"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p 4 $APK aligned.apk
          $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android --out mindustry-signed.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mindustry-apk
          path: mindustry-signed.apk
